<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4976a5">
  <title>ВнеКонтакта — место для своих</title>
  <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body class="signed-out">
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="icon-feed" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="icon-messages" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5A9 9 0 0 1 4 11.5a8.5 8.5 0 0 1 17 0Z"/><path d="M8.5 11.5h7"/></symbol>
    <symbol id="icon-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3.9a8 8 0 0 0-1.8-1L14.4 3h-4.8l-.4 2.9a8 8 0 0 0-1.8 1L5.1 6l-2 3.5 2 1.5a8 8 0 0 0 0 2l-2 1.5 2 3.5 2.3-.9a8 8 0 0 0 1.8 1l.4 2.9h4.8l.4-2.9a8 8 0 0 0 1.8-1l2.3.9 2-3.5-2-1.5c.1-.3.1-.7.1-1Z"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5.5-5.5L5 20"/></symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4.2-8.8L2 9l20-7ZM11 13l11-11"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M12 20h9M4 16l-1 5 5-1L20 8a3 3 0 0 0-4-4L4 16Z"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  </svg>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#feed" class="brand" data-view="feed" aria-label="ВнеКонтакта — главная"><span class="brand-mark">В</span><span class="brand-word">Вне<span class="brand-light">Контакта</span></span></a>
      <div class="topbar-middle"><span class="header-pill">место для своих</span></div>
      <div id="header-account"></div>
    </div>
  </header>
  <div class="app-layout">
    <nav id="sidebar" class="sidebar" aria-label="Главное меню">
      <div class="nav-group">
        <button class="nav-item" data-view="profile"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-user"></use></svg></span> Моя страница</button>
        <button class="nav-item" data-view="feed"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-feed"></use></svg></span> Новости</button>
        <button class="nav-item" data-view="messages"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-messages"></use></svg></span> Сообщения</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-cog"></use></svg></span> Настройки</button>
      </div>
      <div class="sidebar-divider"></div>
      <button class="nav-item logout-link" id="logout"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-logout"></use></svg></span> Выйти</button>
      <div class="sidebar-foot">ВнеКонтакта © 2026</div>
    </nav>
    <main id="content" class="content" aria-live="polite"></main>
    <aside id="rightbar" class="rightbar">
      <section class="card right-welcome"><div class="welcome-sparkle">✦</div><div class="right-title">ВнеКонтакта</div><p>Знакомые лица, хорошие истории и самые важные моменты.</p><span class="right-footer">Здесь всегда есть о чём поговорить.</span></section>
    </aside>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js?v=4" defer></script>
</body>
</html>
